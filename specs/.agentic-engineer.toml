idea = "Name the OpenChoreo project exactly e2e-todo-20260917 (a new project, not default).\n\nBuild a simple Todo app that MUST include all four of these:\n\n1. An API service (backend) that exposes REST endpoints to list, create, update, and delete todos.\n2. An SPA frontend (web app) where a user can log in, add a todo, see it persist after reload.\n3. A thunder-app ClusterResourceType resource for end-user login on Dataplane Thunder. Issuer must be the development dataplane IdP (https://development-idp.apps.wso2con.openchoreo-poc.choreo.dev), NOT Platform Thunder.\n4. A postgres-cnpg ClusterResourceType resource to persist todos (NOT the sample postgres CRT).\n\nThe API must be protected through the development API platform gateway (namespace default-development, restapi-target api-platform-default-development). SPA calls the API via /api. T2 (dataplane Thunder) tokens should succeed; Platform Thunder (T1) tokens must not.\n\nKeep the app small and complete: login + persist a todo + reload."
